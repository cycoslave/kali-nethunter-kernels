## Docker image: https://hub.docker.com/_/python
image: docker.io/python:3.11

stages:
  - linting
  - generate_documentation

variables:
  # Create a shallow git copy
  GIT_DEPTH: 1

.install_prerequesites_pip: &install_prerequesites_pip |
  pip install -r requirements.txt

.setup_for_html: &setup_for_html |
  apt-get update
  apt-get --yes --no-install-recommends install pandoc

linting:
  stage: linting
  allow_failure: yes
  rules:
    - if: $CI_MERGE_REQUEST_ID                      # Execute jobs in merge request context
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # Execute jobs when a new commit is pushed to default branch
      when: always
  before_script:
    - *install_prerequesites_pip
  script:
    - yamllint devices.yml

kernel_integrity:
  stage: linting
  allow_failure: yes
  rules:
    - if: $CI_MERGE_REQUEST_ID                      # Execute jobs in merge request context
      when: always
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # Execute jobs when a new commit is pushed to default branch
      when: always
  before_script:
    - *install_prerequesites_pip
  script:
    - ./bin/devices_integrity.py > >(tee -a stdout.log) 2> >(tee -a stderr.log >&2)
    - grep -q '[^[:space:]]' stderr.log && exit 1 || exit 0

pages:
  stage: generate_documentation
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH   # Execute jobs when a new commit is pushed to default branch
      when: always
  before_script:
    - *install_prerequesites_pip
    - *setup_for_html
  script:
    - ./bin/generate_image_details.py
    - ./bin/generate_image_summary.py
    - ./bin/generate_kernel_detail.py
    - ./bin/generate_kernel_summary.py
    - mkdir -pv ./public/
    - cp -v ./.gitlab/404.html   ./public/
    - cp -v ./.gitlab/public.css ./public/
    - pandoc --standalone ./.gitlab/www.md    --css=public.css --include-in-header=./.gitlab/header.html --output=./public/index.html
    - pandoc --standalone ./images.md         --css=public.css --include-in-header=./.gitlab/header.html --output=./public/images.html
    - pandoc --standalone ./image-summary.md  --css=public.css --include-in-header=./.gitlab/header.html --output=./public/image-summary.html
    - pandoc --standalone ./kernels.md        --css=public.css --include-in-header=./.gitlab/header.html --output=./public/kernels.html
    - pandoc --standalone ./kernel-summary.md --css=public.css --include-in-header=./.gitlab/header.html --output=./public/kernel-summary.html
    - find public/ -type f -name '*.html' -print -exec sed -i -E 's_<table( |>)_<table id="pretty"\1_' {} +
  artifacts:
    paths:
      - ./public
    expire_in: 1 week
