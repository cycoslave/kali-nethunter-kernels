##* - a37:
##*     model  : Oppo A37fw (2016)
##*     kernels:
##*       - id         : a37-los
##*         description: Oppo A37fw for LineageOS
##*         versions   :
##*           - android     : ten
##*             linux       : 3.10
##*             description : LineageOS 17.1
##*             author      : diamant3
##*             source      : 'git clone https://github.com/diamant3/kernel_oppo_A37f.git -b lineage-17.1'

# Oppo A37 for LineageOS 17.1
[a37-los]
author = "diamant3"
kernelstring = "NetHunter Kernel Oppo A37fw"
arch = arm64
block = /dev/block/bootdevice/by-name/boot
#* Note: when using "anykernel" flasher, use commas to separate device names
devicenames = a37,a37f,a37fw
flasher = anykernel
modules = 1
slot_device = 0

